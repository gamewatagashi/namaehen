<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>m4aファイル名 一括変換</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic",sans-serif;max-width:1050px;margin:28px auto;padding:0 20px;line-height:1.6;color:#222}h1{font-size:26px}.card{border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}button{font-size:16px;padding:10px 18px;border:0;border-radius:8px;cursor:pointer;margin:4px}.primary{background:#222;color:#fff}.secondary{background:#eee}button:disabled{opacity:.45}textarea{width:100%;height:220px;box-sizing:border-box;font-family:monospace;font-size:13px}#status{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:7px;text-align:left}.mono{font-family:monospace}.ok{color:#087a35}.err{color:#b00020}.warn{color:#9a5a00}.notice{background:#fff8df;border:1px solid #ead37b;padding:12px;border-radius:8px}.small{font-size:13px;color:#666}</style></head>
<body>
<h1>m4aファイル名 一括変換</h1>
<p>「生徒No＋名前.m4a」→「ID＋名前.m4a」</p>
<div class="notice"><b>照合：</b>名前ではなく<strong>先頭8桁の生徒No</strong>だけで表と照合します。<br>「47352582_鹿村朝陽.m4a」のような「_」付きもOK。約3MB×900件でも音声本体は読み込みません。</div>
<div class="card"><h2>① m4aフォルダを選択</h2><button class="primary" id="pick" type="button">m4aフォルダを選択</button> <span id="folder">未選択</span><p id="browser" class="small"></p></div>
<div class="card"><h2>② スプレッドシートを貼り付け</h2><p>ID・生徒No・名前の3列をGoogleスプレッドシートからそのままコピー。</p><textarea id="paste" placeholder="ID\t生徒No\t名前
85495\t60292016\t山本剛大
85499\t61641723\t大村実乃梨"></textarea><br><button class="secondary" id="check" type="button">変換内容をチェック</button></div>
<div class="card"><h2>③ チェック結果</h2><div id="status">まだチェックしていません。</div><div id="preview"></div></div>
<div class="card"><h2>④ 一括変換</h2><p class="small">音声データ自体は変更せず、ファイル名だけを変更します。</p><button class="primary" id="rename" type="button" disabled>一括変換する</button></div>
<script>
"use strict";
let dirHandle=null,plan=[];const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function parseTSV(t){const ls=t.replace(/\r/g,"").split("\n").filter(x=>x.trim());if(!ls.length)return[];const rs=ls.map(x=>x.split("\t").map(y=>y.trim()));const f=rs[0].map(x=>x.toLowerCase());return rs.slice(f.includes("id")&&f.some(x=>x.includes("生徒no"))?1:0).filter(r=>r.length>=3&&r[0]&&r[1]&&r[2]);}
function error(m){$("status").innerHTML='<span class="err">'+esc(m)+'</span>';}
$("browser").textContent="最新版のGoogle Chrome / Microsoft Edgeで、GitHub PagesのURLを直接開いてください。";
$("pick").addEventListener("click",async()=>{try{if(!window.isSecureContext)throw Error("HTTPSのページで開いてください。GitHub PagesならHTTPSになります。");if(!window.showDirectoryPicker)throw Error("このブラウザはフォルダ選択に対応していません。最新版ChromeまたはEdgeを使ってください。");dirHandle=await window.showDirectoryPicker({mode:"readwrite"});$("folder").textContent="選択済み";$("folder").className="ok";$("status").textContent="フォルダを選択しました。②へ進んでください。";}catch(e){if(e.name!=="AbortError")error(e.message||e);}});
$("check").addEventListener("click",async()=>{ $("rename").disabled=true;plan=[];if(!dirHandle)return error("先に「m4aフォルダを選択」を押してください。");const rows=parseTSV($("paste").value);if(!rows.length)return error("ID・生徒No・名前の3列を貼り付けてください。");const map=new Map(),dups=[];for(const [id,no,name] of rows){if(map.has(no))dups.push(no);map.set(no,{id,name,no});}const files=[];for await(const [name,h] of dirHandle.entries())if(h.kind==="file"&&name.toLowerCase().endsWith(".m4a"))files.push(name);const unmatched=[],targets=new Map(),dupTargets=[];for(const oldName of files){const base=oldName.slice(0,-4),m=base.match(/^(\d{8})(.*)$/);if(!m){unmatched.push([oldName,"先頭8桁を取得できない"]);continue;}const no=m[1],tail=m[2].replace(/^[_\-\s]+/,"");if(!map.has(no)){unmatched.push([oldName,"表に同じ生徒Noがない"]);continue;}if(!tail){unmatched.push([oldName,"名前部分がない"]);continue;}const nw=map.get(no).id+tail+".m4a";if(nw!==oldName){if(targets.has(nw)&&targets.get(nw)!==oldName)dupTargets.push(nw);targets.set(nw,oldName);plan.push({oldName,newName:nw,no});}}
const oldSet=new Set(files),existing=plan.filter(x=>oldSet.has(x.newName)&&x.newName!==x.oldName);let msg=`m4aファイル：${files.length}件\nスプレッドシート：${rows.length}件\n変換予定：${plan.length}件\n対応できないファイル：${unmatched.length}件\n生徒No重複：${new Set(dups).size}件\n変更先重複：${new Set(dupTargets).size}件\n変更先が既に存在：${new Set(existing.map(x=>x.newName)).size}件`;const safe=!unmatched.length&&!dups.length&&!dupTargets.length&&!existing.length&&plan.length>0;msg+=safe?"\n\n✅ 問題ありません。一括変換できます。":"\n\n⚠️ 安全のため一括変換を停止しています。";$("status").innerHTML='<span class="'+(safe?'ok':'warn')+'">'+esc(msg)+'</span>';
let h='<h3>変換例（最大30件）</h3><table><tr><th>現在</th><th>変更後</th><th>生徒No</th></tr>';for(const x of plan.slice(0,30))h+=`<tr><td class="mono">${esc(x.oldName)}</td><td class="mono">${esc(x.newName)}</td><td>${esc(x.no)}</td></tr>`;h+='</table>';if(unmatched.length){h+='<h3>対応できないファイル（最大50件）</h3><ul>';for(const x of unmatched.slice(0,50))h+=`<li class="mono">${esc(x[0])}：${esc(x[1])}</li>`;h+='</ul>';}$('preview').innerHTML=h;if(safe)$("rename").disabled=false;});
$("rename").addEventListener("click",async()=>{if(!plan.length||!dirHandle)return;if(!confirm(`${plan.length}件のファイル名を変更します。\n音声データは変更しません。\n実行しますか？`))return;let ok=0,fail=0,errs=[];for(const x of plan){try{const fh=await dirHandle.getFileHandle(x.oldName);if(typeof fh.move!=="function")throw Error("このブラウザはファイル名変更に対応していません。最新版Chrome/Edgeを使ってください。");await fh.move(x.newName);ok++;}catch(e){fail++;errs.push(`${x.oldName} → ${x.newName}：${e.message||e}`);}}let m=`完了\n成功：${ok}件\n失敗：${fail}件`;if(errs.length)m+='\n\n'+errs.slice(0,20).join("\n");$("status").innerHTML='<span class="'+(fail?'warn':'ok')+'">'+esc(m)+'</span>';$("rename").disabled=true;});
</script></body></html>
